server:
  port: 8888
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/api_backend?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_ROOT_PASSWORD:123456}
    jpa:
      hibernate:
        ddl-auto: none   # set none for production, you can dùng update để dev
      show-sql: true
      properties:
        hibernate:
          format_sql: true

app:
  base-url: http://localhost:8888
  api:
    prefix: api/v1
  cors:
    allowed-origins:
      - "http://localhost:5173"
#      - "https://myapp.com" them cac dia chi can cap cho
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
    allowed-headers:
      - "*"
  jwt:
    secret: dnB5RdBdsPe3dboZnT+xBOlIASP/2XPqRQ4duXi8YyVU090z4koknuLS6YgVXBCv4T3YXh0F4vaSWJv/zov4CA==
    accessTokenExpirationMs: 900000  # 15 phut
    refreshTokenExpirationMs: 2592000000  # 30 ngay

security:
  permit-all-paths:
    - /api/v1/auth/**
    - /api/v1/public/**
    - /api/v1/images/**
    - /files/**
    - uploads/**
file:
  upload-dir: ./uploads
  url-path: /uploads/**
  max-size: 5MB #toi da 5MB